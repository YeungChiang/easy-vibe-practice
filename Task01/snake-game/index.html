<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸语织境 · 诗境贪吃蛇</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>DATAWHALE / EASY-VIBE / TASK 01</small><h1>鲸语织境 <span>诗境贪吃蛇</span></h1><p>拾取八个词语，织成一首诗与一幅画。</p></div><div class="mode" id="mode">本地模拟 · 未调用 AI</div></header><div class="layout"><section class="panel"><div class="bar"><div>得分 <b id="score">0</b></div><div>已收集 <b id="count">0 / 8</b></div><div id="status" role="status">准备开始</div></div><canvas id="board" width="540" height="540" aria-label="贪吃蛇棋盘"></canvas><div class="controls"><button id="start">开始 / 重开</button><button id="pause">暂停 / 继续</button><label><input type="checkbox" id="classic"> 经典模式</label></div><div class="arrows"><button data-dir="ArrowUp">↑</button><button data-dir="ArrowLeft">←</button><button data-dir="ArrowDown">↓</button><button data-dir="ArrowRight">→</button></div><p class="hint">方向键或屏幕方向按钮移动 · 撞墙或自身结束 · 经典模式不生成诗画</p></section><section class="panel studio"><small>WORD COLLECTION</small><h2>拾词成境</h2><div id="words" class="words"></div><hr><small>POETRY & IMAGE</small><h2>诗与画</h2><div id="poem" class="poem">收集满八个词语后，诗画将在这里呈现。</div><div id="art" class="art">静候灵感</div><button id="remix" disabled>重新生成诗画</button><p id="generation" class="hint" role="status">离线版本使用规则拼接诗句与 SVG 绘图，非真实模型生成。</p></section></div><footer>学习实验 · 原创实现 · Vibe Coding 101 · 方向键控制</footer></main><script src="core.js"></script><script src="app.js"></script></body></html>
